<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Day</title>
    <link rel="icon" type="image/x-icon" href="/images/cat_img.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Welcome to Cozy Day!</h1>
        <p>A little adventure for your day...</p>
    </header>
    <main>
        <section>
            <h2>Choose your Tool.</h2>
            <button id="plantBtn" type="button">🌱</button>
            <button id="waterBtn" type="button">💧</button>
            <button id="axeBtn" type="button">🪓</button>
            <button id="pickaxeBtn" type="button">⛏️</button>
        </section>
        <section>
            <h2>Your Cozy task.</h2>
            <p id="task">Choose a tool to begin!</p>
            <button id="completeBtn" type="button">Complete Task</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
